[package]
name = "gicp-slam-cuda"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"

pcd-rs = { version = "0.11", features = ["derive"] }

regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

cudarc = { version = "0.18.1", features = ["cuda-12060"] }

ndarray = { version = "0.15", features = ["blas", "rayon"] }
nalgebra = "0.34.1"